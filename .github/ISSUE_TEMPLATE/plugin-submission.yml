name: Submit a plugin
description: Get your plugin listed in the gauzzaDocs marketplace
title: "Plugin: "
labels: ["plugin submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for building a plugin! There are two ways to get it listed.

        You can open a pull request that adds `plugins/<your-id>/` to this repo and runs `npm run marketplace`. That works best for small plugins with no dependencies.

        You can also keep it in your own repo and fill in this form, or open a pull request that adds one line to `plugins/external.json`. It gets pinned to a commit, so people install exactly what was reviewed. A new version just moves the pin.

        Before you submit, run `gdocs plugins validate <folder>`. It runs the same checks as CI. Plugins can't import Node modules, use eval or make network requests.
  - type: input
    id: id
    attributes:
      label: Plugin id
      description: Lower case, the same as "id" in plugin.json
      placeholder: mermaid-preview
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where is it?
      description: "Your repository folder, or a raw URL pinned to a commit: https://raw.githubusercontent.com/<you>/<repo>/<40 character commit>/<folder>/"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What does it do?
      description: Which file types it works with and what it adds (formatters, previews or commands). Screenshots help.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: "`gdocs plugins validate` passes"
          required: true
        - label: It doesn't send data anywhere or run code it downloads
          required: true
        - label: It can be listed under this repo's MIT license, or its own license is in its folder
          required: true
